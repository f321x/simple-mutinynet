services:
  bitcoind:
    container_name: "bitcoind"
    build: bitcoind
    restart: always
    volumes:
      - ./bitcoind/bitcoin_data:/root/.bitcoin
      - ./bitcoind/bitcoin.conf:/root/.bitcoin/bitcoin.conf
    networks:
      - bitcoin-network

  electrumx:
    container_name: electrumx
    build: ./electrumx
    volumes:
      - ./electrumx/electrumx_data:/data
    networks:
      - bitcoin-network
    ports:
      - 0.0.0.0:51234:51234 # Expose ElectrumX to host, access at localhost:51234:s
    environment:
      # - REPORT_SERVICES=ssl://example.com:51234  # externally reachable endpoint for peer discovery, https://electrumx-spesmilo.readthedocs.io/en/latest/environment.html#envvar-REPORT_SERVICES
      - ALLOW_ROOT=1
      - COST_SOFT_LIMIT=0 
      - COST_HARD_LIMIT=0 
      - COIN=Bitcoin
      - NET=mutinynet
      - SERVICES=ssl://:51234,rpc:// 
      - DAEMON_URL=http://bitcoin:bitcoin@bitcoind:38332 # Using container name
      - DB_DIRECTORY=/data
      - DAEMON_POLL_INTERVAL_BLOCKS=60
      - DAEMON_POLL_INTERVAL_MEMPOOL=60
      - PEER_ANNOUNCE=1
      - SSL_CERTFILE=/data/server.crt
      - SSL_KEYFILE=/data/server.key
    depends_on:
      - bitcoind
    restart: always

networks:
  bitcoin-network:
    driver: bridge
